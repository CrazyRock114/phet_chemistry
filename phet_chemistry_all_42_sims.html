        ]
      },
      {
        id: 'showDensity',
        key: 'showDensity',
        name: 'showDensity',
        type: 'checkbox',
        label: '显示概率密度 |ψ(x)|² 填充阴影',
        default: true,
        value: true
      }
    ],
    defaultState: {
      mode: 'square',
      separation: 2.1,
      wellDepth: 30,
      wellWidth: 1.0,
      quantumState: 'both',
      showDensity: true,
      phase: 0,
      draggingWell: false
    },
    init(state) {
      state._initialized = true;
      state.phase = 0;
    },
    update(dt, state) {
      if (!state._initialized) this.init(state);
      const R = Number(state.separation) || 2.1;
      const V0 = Number(state.wellDepth) || 30;
      const a = Number(state.wellWidth) || 1.0;
      const { deltaE } = computeDoubleWellQuantum(R, V0, a);
      state.phase = (state.phase || 0) + dt * deltaE * 0.45;
    },
    render(ctx, width, height, state) {
      if (!state._initialized) this.init(state);
      ctx.save();
      ctx.fillStyle = '#090d16';
      ctx.fillRect(0, 0, width, height);

      const R = Number(state.separation) || 2.1;
      const V0 = Number(state.wellDepth) || 30;
      const a = Number(state.wellWidth) || 1.0;
      const wellType = state.mode || 'square';
      const qm = computeDoubleWellQuantum(R, V0, a);

      // Left Panel: Double Well Potential V(x) & Wavefunctions ψ_+(x), ψ_-(x)
      const lx = 20,
        ly = 20,
        lw = 540,
        lh = 500;
      drawRoundedRect(ctx, lx, ly, lw, lh, 12);
      ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(148, 163, 184, 0.3)';
      ctx.stroke();

      const midX = lx + lw / 2;
      const topZeroY = ly + 90; // E = 0 level
      const eToY = (E) => topZeroY - E * 7.8; // E is negative (-50..0 eV)
      const xToPx = (xVal) => midX + xVal * 62; // x in [-4, 4] Å

      // Draw V = 0 reference line
      ctx.strokeStyle = 'rgba(148, 163, 184, 0.4)';
      ctx.setLineDash([4, 4]);
      ctx.beginPath();
      ctx.moveTo(lx + 24, topZeroY);
      ctx.lineTo(lx + lw - 24, topZeroY);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = '#94a3b8';
      ctx.font = '11px system-ui, sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText('E = 0 eV (连续谱阈值)', lx + 30, topZeroY - 6);

      // Draw Potential Profile V(x)
      const xL = -R / 2;
      const xR = R / 2;
      ctx.strokeStyle = '#cbd5e1';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      for (let xv = -4.0; xv <= 4.0; xv += 0.03) {
        let Vval = 0;
        if (wellType === 'square') {
          const inLeft = Math.abs(xv - xL) <= a / 2;
          const inRight = Math.abs(xv - xR) <= a / 2;
          Vval = inLeft || inRight ? -V0 : 0;
        } else {
          const r1 = Math.sqrt((xv - xL) * (xv - xL) + 0.14);
          const r2 = Math.sqrt((xv - xR) * (xv - xR) + 0.14);
          Vval = clamp(-(V0 * 0.22) * (1 / r1 + 1 / r2), -V0 * 1.15, 0);
        }
        const px = xToPx(xv);
        const py = eToY(Vval);
        if (xv === -4.0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.stroke();

      // Helper to draw an eigenstate (baseline at E_level, wavefunction + |ψ|^2)
      const drawEigenstate = (E_val, sign, color, label, yWaveScale) => {
        const baseY = clamp(eToY(E_val), topZeroY + 18, ly + lh - 40);
        ctx.strokeStyle = color;
        ctx.setLineDash([5, 3]);
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(lx + 30, baseY);
        ctx.lineTo(lx + lw - 30, baseY);
        ctx.stroke();
        ctx.setLineDash([]);

        ctx.fillStyle = color;
        ctx.font = 'bold 12px system-ui, sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText(`${label}: ${E_val.toFixed(2)} eV`, lx + 34, baseY - 6);

        // Compute normalized ψ(x)
        const pts = [];
        let maxAbs = 0.001;
        for (let xv = -3.9; xv <= 3.9; xv += 0.04) {
          const phiL = evalAtomicOrbital(xv, xL, a, V0, wellType);
          const phiR = evalAtomicOrbital(xv, xR, a, V0, wellType);
          let psi = 0;
          if (sign === 'superposition') {
            const cPlus = (phiL + phiR) / Math.sqrt(2 * (1 + qm.S));
            const cMinus = (phiL - phiR) / Math.sqrt(2 * Math.max(0.2, 1 - qm.S));
            // Real part of time-evolving superposition: ψ(x,t) ∝ ψ_+ + ψ_- cos(ΔE t / ħ)
            psi = 0.707 * (cPlus + cMinus * Math.cos(state.phase));
          } else {
            psi = phiL + sign * phiR;
          }
          maxAbs = Math.max(maxAbs, Math.abs(psi));
          pts.push({ xv, psi });
        }

        if (state.showDensity) {
          ctx.fillStyle = color + '33';
          ctx.beginPath();
          ctx.moveTo(xToPx(pts[0].xv), baseY);
          for (const p of pts) {
            const normPsi = p.psi / maxAbs;
            ctx.lineTo(xToPx(p.xv), baseY - normPsi * normPsi * yWaveScale * 0.85);
          }
          ctx.lineTo(xToPx(pts[pts.length - 1].xv), baseY);
          ctx.closePath();
          ctx.fill();
        }

        ctx.strokeStyle = color;
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        pts.forEach((p, idx) => {
          const normPsi = p.psi / maxAbs;
          const px = xToPx(p.xv);
          const py = baseY - normPsi * yWaveScale;
          if (idx === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        });
        ctx.stroke();

        // Mark nodal plane at x=0 for antibonding state
        if (sign === -1) {
          ctx.fillStyle = '#fde047';
          ctx.beginPath();
          ctx.arc(midX, baseY, 4.5, 0, Math.PI * 2);
          ctx.fill();
          ctx.font = '11px system-ui, sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('节面 (ψ₋=0)', midX, baseY + 16);
        }
      };

      if (state.quantumState === 'both' || state.quantumState === 'bonding') {
        drawEigenstate(qm.E_plus, +1, '#4ade80', '成键态 ψ₊ (σ 基态)', 36);
      }
      if (state.quantumState === 'both' || state.quantumState === 'antibonding') {
        drawEigenstate(qm.E_minus, -1, '#f43f5e', '反键态 ψ₋ (σ* 激发态)', 36);
      }
      if (state.quantumState === 'superposition') {
        drawEigenstate(0.5 * (qm.E_plus + qm.E_minus), 'superposition', '#38bdf8', '量子隧穿相干叠加态 |Ψ(x,t)|²', 44);
      }

      // Draw draggable nuclei handles at bottom of Left Panel
      const nucY = ly + lh - 22;
      drawSphere(ctx, xToPx(xL), nucY, 12, '#38bdf8', 'A');
      drawSphere(ctx, xToPx(xR), nucY, 12, '#38bdf8', 'B');
      ctx.fillStyle = '#94a3b8';
      ctx.font = '11px system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(`⇄ 拖拽原子核调节间距 R = ${R.toFixed(2)} Å`, midX, nucY - 16);

      // Right Panel: Energy Splitting Diagram E_±(R) vs Internuclear Distance R
      const rx = 576,
        ry = 20,
        rw = 304,
        rh = 500;
      drawRoundedRect(ctx, rx, ry, rw, rh, 12);
      ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(56, 189, 248, 0.35)';
      ctx.stroke();

      ctx.fillStyle = '#38bdf8';
      ctx.font = 'bold 15px system-ui, sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText('成键/反键能级分裂曲线 E±(R)', rx + 18, ry + 34);

      // Plot E_plus(R) and E_minus(R)
      const plotX = rx + 26,
        plotY = ry + 56,
        plotW = rw - 44,
        plotH = 225;
      drawRoundedRect(ctx, plotX, plotY, plotW, plotH, 8);
      ctx.fillStyle = 'rgba(30, 41, 59, 0.75)';
      ctx.fill();

      const rToPlotX = (rVal) => plotX + ((rVal - 0.8) / 4.2) * plotW;
      const eToPlotY = (eVal) => clamp(plotY + 35 - (eVal - qm.E0) * 6.5, plotY + 8, plotY + plotH - 8);

      // Isolated E0 reference line
      const e0PlotY = eToPlotY(qm.E0);
      ctx.strokeStyle = 'rgba(148, 163, 184, 0.4)';
      ctx.setLineDash([4, 4]);
      ctx.beginPath();
      ctx.moveTo(plotX, e0PlotY);
      ctx.lineTo(plotX + plotW, e0PlotY);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = '#94a3b8';
      ctx.font = '10px system-ui, sans-serif';
      ctx.textAlign = 'right';
      ctx.fillText('孤立能级 E₀', plotX + plotW - 6, e0PlotY - 5);

      // Draw E_+(R) curve (green) and E_-(R) curve (red)
      for (const [isMinus, col] of [
        [false, '#4ade80'],
        [true, '#f43f5e']
      ]) {
        ctx.strokeStyle = col;
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        for (let rv = 0.9; rv <= 4.8; rv += 0.05) {
          const res = computeDoubleWellQuantum(rv, V0, a);
          const px = rToPlotX(rv);
          const py = eToPlotY(isMinus ? res.E_minus : res.E_plus);
          if (rv === 0.9) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.stroke();
      }

      // Mark current R on splitting plot
      const curPlotX = rToPlotX(R);
      const curPlusY = eToPlotY(qm.E_plus);
      const curMinusY = eToPlotY(qm.E_minus);
      ctx.strokeStyle = 'rgba(250, 204, 21, 0.5)';
      ctx.beginPath();
      ctx.moveTo(curPlotX, curMinusY);
      ctx.lineTo(curPlotX, curPlusY);
      ctx.stroke();

      ctx.fillStyle = '#4ade80';
      ctx.beginPath();
      ctx.arc(curPlotX, curPlusY, 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#f43f5e';
      ctx.beginPath();
      ctx.arc(curPlotX, curMinusY, 5, 0, Math.PI * 2);
      ctx.fill();

      // Bottom Readout Summary Cards on Right Panel
      const stats = [
        ['成键态能量 E₊ (σ)', `${qm.E_plus.toFixed(2)} eV (核间相长干涉)`],
        ['反键态能量 E₋ (σ*)', `${qm.E_minus.toFixed(2)} eV (核间节面相消)`],
        ['能级分裂 ΔE = E₋ − E₊', `${qm.deltaE.toFixed(2)} eV (重叠积分 S=${qm.S.toFixed(2)})`]
      ];
      stats.forEach(([k, v], i) => {
        const cy0 = ry + 298 + i * 62;
        drawRoundedRect(ctx, plotX, cy0, plotW, 52, 8);
        ctx.fillStyle = 'rgba(30, 41, 59, 0.8)';
        ctx.fill();
        ctx.fillStyle = '#94a3b8';
        ctx.font = '11px system-ui, sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText(k, plotX + 12, cy0 + 19);
        ctx.fillStyle = i === 0 ? '#4ade80' : i === 1 ? '#f43f5e' : '#facc15';
        ctx.font = 'bold 12px system-ui, sans-serif';
        ctx.fillText(v, plotX + 12, cy0 + 39);
      });

      ctx.restore();
    },
    getReadouts(state) {
      const R = Number(state.separation) || 2.1;
      const V0 = Number(state.wellDepth) || 30;
      const a = Number(state.wellWidth) || 1.0;
      const qm = computeDoubleWellQuantum(R, V0, a);
      return [
        { label: '势阱间距 R', name: '势阱间距 R', value: R.toFixed(2), unit: 'Å' },
        { label: '成键基态 E₊(σ)', name: '成键基态 E₊(σ)', value: qm.E_plus.toFixed(2), unit: 'eV' },
        { label: '反键激发态 E₋(σ*)', name: '反键激发态 E₋(σ*)', value: qm.E_minus.toFixed(2), unit: 'eV' },
        { label: '能级分裂 ΔE', name: '能级分裂 ΔE', value: qm.deltaE.toFixed(2), unit: 'eV' }
      ];
    },
    onPointerDown(x, y, state) {
      if (x < 560) {
        state.draggingWell = true;
        const distFromMid = Math.abs(x - 290) / 62;
        state.separation = clamp(distFromMid * 2, 1.0, 4.8);
      } else if (x >= 602 && x <= 862 && y >= 76 && y <= 301) {
        state.draggingWell = true;
        state.separation = clamp(0.8 + ((x - 602) / 260) * 4.2, 1.0, 4.8);
      }
    },
    onPointerMove(x, y, state) {
      if (!state.draggingWell) return;
      if (x < 560) {
        const distFromMid = Math.abs(x - 290) / 62;
        state.separation = clamp(distFromMid * 2, 1.0, 4.8);
      } else {
        state.separation = clamp(0.8 + ((x - 602) / 260) * 4.2, 1.0, 4.8);
      }
    },
    onPointerUp(x, y, state) {
      state.draggingWell = false;
    }
  });
})();

</script>
  <script>
/**
 * PhET Chemistry HTML5 Simulations - Group 3: Reactions, Stoichiometry & States of Matter / Gases
 * File: /Users/crazyrock/gemini/phet_chemistry/js/sims_reactions_states1.js
 * Canvas logical resolution: width = 900, height = 540
 * Implements 7 complete interactive simulations via window.registerSim(id, config):
 *   1. 'balancing-chemical-equations'
 *   2. 'reactants-products-and-leftovers'
 *   3. 'states-of-matter-basics'
 *   4. 'states-of-matter'
 *   5. 'gases-intro'
 *   6. 'gas-properties'
 *   7. 'diffusion'
 */
(function () {
  'use strict';

  function register(id, rawCfg) {
    const cfg = {
      title: rawCfg.title,
      controls: (rawCfg.controls || []).map(c => ({
        ...c,
        id: c.id || c.key,
        type: c.type === "slider" ? "range" : c.type
      })),
      init(state, api) {
        if (typeof rawCfg.init === "function") {
          const initObj = rawCfg.init();
          if (initObj && typeof initObj === "object") {
            Object.assign(state, initObj);
          }
        }
      },
      update(dt, state, api) {
        if (typeof rawCfg.update === "function") {
          if (typeof dt === "number") {
            rawCfg.update(state, dt, api);
          } else {
            rawCfg.update(dt, state, api);
          }
        }
      },
      render(ctx, width, height, state, api) {
        if (typeof rawCfg.render === "function") {
          const actualState = (typeof width === "number" && state && typeof state === "object") ? state : height;
          rawCfg.render(ctx, { width: 900, height: 540 }, actualState);
        }
      },
      onParamChange(key, value, state, api) {
        if (typeof rawCfg.onParamChange === "function") {
          if (typeof key === "string") {
            rawCfg.onParamChange(state, key, value);
          } else {
            rawCfg.onParamChange(key, value, state);
          }
        }
      },
      onPointerDown(x, y, state, api) {
        if (typeof rawCfg.onPointerDown === "function") {
          if (typeof x === "number") rawCfg.onPointerDown(state, x, y);
          else rawCfg.onPointerDown(x, y, state);
        }
      },
      onPointerMove(x, y, state, api) {
        if (typeof rawCfg.onPointerMove === "function") {
          if (typeof x === "number") rawCfg.onPointerMove(state, x, y);
          else rawCfg.onPointerMove(x, y, state);
        }
      },
      onPointerUp(x, y, state, api) {
        if (typeof rawCfg.onPointerUp === "function") {
          if (typeof x === "number") rawCfg.onPointerUp(state, x, y);
          else rawCfg.onPointerUp(x, y, state);
        }
      },
      getReadouts(state) {
        if (id === "balancing-chemical-equations") {
          return [
            { label: "配平状态", value: state.isBalanced ? "已配平 ✓" : "未配平" },
            { label: "闯关得分", value: (state.score || 0) + " 分" }
          ];
        }
        if (id === "reactants-products-and-leftovers") {
          return [
            { label: "反应批次 ξ", value: String(state.extent || 0) },
            { label: "模式", value: state.gameMode ? "挑战模式" : "探索模式" }
          ];
        }
        if (id === "states-of-matter-basics" || id === "states-of-matter") {
          return [
            { label: "温度 T", value: Math.round(state.tempK || 0) + " K" },
            { label: "压强 P", value: (state.pressureAtm || 0).toFixed(2) + " atm" },
            { label: "当前相态", value: state.currentPhase || "solid" }
          ];
        }
        if (id === "gases-intro" || id === "gas-properties") {
          return [
            { label: "粒子总数 N", value: String((state.particles || []).length) },
            { label: "温度 T", value: Math.round(state.tempK || 300) + " K" },
            { label: "压强 P", value: (state.pressureAtm || 0).toFixed(1) + " atm" },
            { label: "器壁碰撞/10ps", value: String(state.wallCollisions || 0) }
          ];
        }
        if (id === "diffusion") {
          return [
            { label: "扩散时间 t", value: (state.elapsedSec || 0).toFixed(1) + " ps" },
            { label: "理论速率比 r₁/r₂", value: Math.sqrt(((state.t1||300)/(state.m1||4))/((state.t2||300)/(state.m2||32))).toFixed(2) }
          ];
        }
        return [];
      }
    };
    if (typeof window !== "undefined" && typeof window.registerSim === "function") {
      window.registerSim(id, cfg);
    }
  }

  // ============================================================================
  // SHARED CPK ELEMENT COLORS, RADII & DRAWING UTILITIES
  // ============================================================================
  const ATOM_STYLE = {
    H: { color: '#f8fafc', stroke: '#475569', r: 8, name: '氢 (H)' },
    C: { color: '#334155', stroke: '#0f172a', r: 12, name: '碳 (C)' },
    N: { color: '#3b82f6', stroke: '#1d4ed8', r: 12, name: '氮 (N)' },
    O: { color: '#ef4444', stroke: '#991b1b', r: 12, name: '氧 (O)' },
    P: { color: '#f97316', stroke: '#c2410c', r: 13, name: '磷 (P)' },
    S: { color: '#eab308', stroke: '#a16207', r: 13, name: '硫 (S)' },
    Cl: { color: '#22c55e', stroke: '#15803d', r: 13, name: '氯 (Cl)' },
    Fe: { color: '#d97706', stroke: '#78350f', r: 14, name: '铁 (Fe)' },
    Ne: { color: '#06b6d4', stroke: '#0e7490', r: 10, name: '氖 (Ne)' },
    Ar: { color: '#ec4899', stroke: '#9d174d', r: 13, name: '氩 (Ar)' },
    Bread: { color: '#f59e0b', stroke: '#b45309', r: 13, name: '面包片' },
    Cheese: { color: '#fde047', stroke: '#ca8a04', r: 12, name: '奶酪片' },
    Meat: { color: '#b91c1c', stroke: '#7f1d1d', r: 12, name: '火腿片' }
  };

  function clamp(v, min, max) {
    return Math.max(min, Math.min(max, v));
  }

  function roundRect(ctx, x, y, w, h, r) {
    const rad = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + rad, y);
    ctx.arcTo(x + w, y, x + w, y + h, rad);
    ctx.arcTo(x + w, y + h, x, y + h, rad);
    ctx.arcTo(x, y + h, x, y, rad);
    ctx.arcTo(x, y, x + w, y, rad);
    ctx.closePath();
  }

  function drawPanel(ctx, x, y, w, h, title, bg = '#1e293b', border = '#334155') {
    ctx.save();
    roundRect(ctx, x, y, w, h, 10);
    ctx.fillStyle = bg;
    ctx.fill();
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = border;
    ctx.stroke();
    if (title) {
      ctx.fillStyle = '#e2e8f0';
      ctx.font = 'bold 13px system-ui, -apple-system, sans-serif';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'top';
      ctx.fillText(title, x + 12, y + 9);
      ctx.beginPath();
      ctx.moveTo(x + 8, y + 29);
      ctx.lineTo(x + w - 8, y + 29);
      ctx.strokeStyle = 'rgba(148,163,184,0.25)';
      ctx.lineWidth = 1;
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawSphere(ctx, x, y, r, color, strokeColor, label) {
    ctx.save();
    const grad = ctx.createRadialGradient(x - r * 0.35, y - r * 0.35, r * 0.1, x, y, r);
    grad.addColorStop(0, '#ffffff');
    grad.addColorStop(0.28, color);
    grad.addColorStop(1, strokeColor || '#0f172a');
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.lineWidth = 1;
    ctx.strokeStyle = strokeColor || '#0f172a';
    ctx.stroke();
    if (label) {
      ctx.fillStyle = color === '#f8fafc' || color === '#fde047' ? '#0f172a' : '#ffffff';
      ctx.font = `bold ${Math.max(8, Math.round(r * 0.85))}px system-ui, sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(label, x, y + 0.5);
    }
    ctx.restore();
  }

  function drawMoleculeIcon(ctx, formula, cx, cy, scale = 1.0, angle = 0) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(angle);
    ctx.scale(scale, scale);

    const bond = (x1, y1, x2, y2, order = 1) => {
      ctx.strokeStyle = '#94a3b8';
      ctx.lineCap = 'round';
      if (order === 1) {
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
      } else {
        const dx = x2 - x1;
        const dy = y2 - y1;
        const len = Math.hypot(dx, dy) || 1;
        const nx = (-dy / len) * 2.8;
        const ny = (dx / len) * 2.8;
        ctx.lineWidth = 2.4;
        ctx.beginPath();
        ctx.moveTo(x1 + nx, y1 + ny);
        ctx.lineTo(x2 + nx, y2 + ny);
        ctx.moveTo(x1 - nx, y1 - ny);
        ctx.lineTo(x2 - nx, y2 - ny);
        ctx.stroke();
      }
    };

    const atom = (el, x, y, showLabel = false) => {
      const st = ATOM_STYLE[el] || ATOM_STYLE.C;

  function drawButton(ctx, btn, active = false) {
    ctx.save();
    roundRect(ctx, btn.x, btn.y, btn.w, btn.h, btn.r || 6);
    if (active) {
      ctx.fillStyle = btn.activeBg || '#2563eb';
      ctx.strokeStyle = btn.activeBorder || '#60a5fa';
    } else {
      ctx.fillStyle = btn.bg || '#334155';
      ctx.strokeStyle = btn.border || '#475569';
    }
    ctx.fill();
    ctx.lineWidth = 1.5;
    ctx.stroke();

    ctx.fillStyle = active ? '#ffffff' : btn.color || '#f1f5f9';
    ctx.font = btn.font || 'bold 12px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(btn.label, btn.x + btn.w / 2, btn.y + btn.h / 2 + 0.5);
    ctx.restore();
  }

  function hitBox(px, py, box) {
    return px >= box.x && px <= box.x + box.w && py >= box.y && py <= box.y + box.h;
  }

  function drawHeatCoolBucket(ctx, cx, bottomY, heatLevel) {
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(cx - 52, bottomY + 12);
    ctx.lineTo(cx + 52, bottomY + 12);
    ctx.lineTo(cx + 42, bottomY + 54);
    ctx.lineTo(cx - 42, bottomY + 54);
    ctx.closePath();
    const bGrad = ctx.createLinearGradient(cx - 50, bottomY, cx + 50, bottomY);
    bGrad.addColorStop(0, '#475569');
    bGrad.addColorStop(0.5, '#94a3b8');
    bGrad.addColorStop(1, '#334155');
    ctx.fillStyle = bGrad;
    ctx.fill();
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = '#1e293b';
    ctx.stroke();

    if (heatLevel > 0.05) {
      const h = 14 + heatLevel * 28;
      for (let i = -2; i <= 2; i++) {
        const fx = cx + i * 14;
        const fy = bottomY + 12;
        ctx.beginPath();
        ctx.moveTo(fx - 9, fy);
        ctx.quadraticCurveTo(fx - 4, fy - h * 0.7, fx, fy - h);
        ctx.quadraticCurveTo(fx + 4, fy - h * 0.7, fx + 9, fy);
        ctx.closePath();
        ctx.fillStyle = i % 2 === 0 ? 'rgba(249,115,22,0.88)' : 'rgba(250,204,21,0.92)';
        ctx.fill();
      }
    } else if (heatLevel < -0.05) {
      const c = Math.abs(heatLevel);
      for (let i = -2; i <= 2; i++) {
        const ix = cx + i * 13;
        const iy = bottomY + 4 - c * 10;
        ctx.save();
        ctx.translate(ix, iy);
        ctx.rotate(i * 0.2);
        roundRect(ctx, -7, -7, 14, 14, 3);
        ctx.fillStyle = 'rgba(56,189,248,0.82)';
        ctx.fill();
        ctx.strokeStyle = '#bae6fd';
        ctx.lineWidth = 1;
        ctx.stroke();
        ctx.restore();
      }
    }

    ctx.fillStyle = '#0f172a';
    ctx.font = 'bold 11px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(
      heatLevel > 0.05 ? '🔥 加热中' : heatLevel < -0.05 ? '❄️ 冷却中' : '加热 / 冷却器',
      cx,
      bottomY + 34
    );
    ctx.restore();
  }

  function drawThermometer(ctx, x, y, h, tempK, maxK = 600, showCelsius = false) {
    ctx.save();
    const bulbR = 11;
    const tubeW = 10;
    roundRect(ctx, x - 34, y - 24, 88, h + 46, 8);
    ctx.fillStyle = 'rgba(15,23,42,0.82)';
    ctx.fill();
    ctx.strokeStyle = '#334155';
    ctx.lineWidth = 1;
    ctx.stroke();

    roundRect(ctx, x - tubeW / 2, y, tubeW, h, 5);
    ctx.fillStyle = '#f8fafc';
    ctx.fill();
    ctx.strokeStyle = '#64748b';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    const frac = clamp(tempK / maxK, 0.02, 1);
    const fillH = frac * (h - 6);
    ctx.fillStyle = '#ef4444';
    ctx.fillRect(x - tubeW / 2 + 2, y + h - fillH, tubeW - 4, fillH + 4);

    ctx.beginPath();
    ctx.arc(x, y + h + 5, bulbR, 0, Math.PI * 2);
    ctx.fillStyle = '#ef4444';
    ctx.fill();
    ctx.strokeStyle = '#991b1b';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    const valStr = showCelsius
      ? `${Math.round(tempK - 273.15)} °C`
      : `${Math.round(tempK)} K`;
    ctx.fillStyle = '#f8fafc';
    ctx.font = 'bold 11px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(valStr, x + 10, y - 9);
    ctx.restore();
  }

  function drawPressureGauge(ctx, cx, cy, r, pressureAtm, maxAtm = 50, unit = 'atm') {
    ctx.save();
    ctx.fillStyle = '#64748b';
    ctx.fillRect(cx - 5, cy + r - 2, 10, 14);

    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fillStyle = '#f8fafc';
    ctx.fill();
    ctx.lineWidth = 4;
    ctx.strokeStyle = '#475569';
    ctx.stroke();

    const startAng = Math.PI * 0.75;
    const sweep = Math.PI * 1.5;
    for (let i = 0; i <= 10; i++) {
      const a = startAng + (i / 10) * sweep;
      const x1 = cx + Math.cos(a) * (r - 8);
      const y1 = cy + Math.sin(a) * (r - 8);
      const x2 = cx + Math.cos(a) * (r - 3);
      const y2 = cy + Math.sin(a) * (r - 3);
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.strokeStyle = i >= 8 ? '#ef4444' : '#334155';
      ctx.lineWidth = i % 2 === 0 ? 2 : 1;
      ctx.stroke();
    }

    const pFrac = clamp(pressureAtm / maxAtm, 0, 1.05);
    const needleAng = startAng + pFrac * sweep;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.cos(needleAng) * (r - 10), cy + Math.sin(needleAng) * (r - 10));
    ctx.strokeStyle = '#dc2626';
    ctx.lineWidth = 2.5;
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(cx, cy, 4, 0, Math.PI * 2);
    ctx.fillStyle = '#1e293b';
    ctx.fill();

    const dispVal =
      unit === 'kPa'
        ? `${(pressureAtm * 101.325).toFixed(0)} kPa`
        : `${pressureAtm.toFixed(1)} atm`;
    roundRect(ctx, cx - 32, cy + r * 0.28, 64, 16, 4);
    ctx.fillStyle = '#0f172a';
    ctx.fill();
    ctx.fillStyle = '#38bdf8';
    ctx.font = 'bold 10px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(dispVal, cx, cy + r * 0.28 + 8);

    ctx.fillStyle = '#334155';
    ctx.font = 'bold 9px system-ui, sans-serif';
    ctx.fillText('PRESSURE', cx, cy - r * 0.35);
    ctx.restore();
  }

    onParamChange(state, key, value) {
      if (key === 'modeSelect' && typeof value === 'string') {
        const [m, idxStr] = value.split(':');
        state.mode = m === 'game' ? 'game' : 'intro';
        state.eqIndex = parseInt(idxStr, 10) || 0;
        const eq = EQUATION_BANK[state.mode][state.eqIndex];
        state.coeffs = new Array(eq.reactants.length + eq.products.length).fill(1);
      } else if (key === 'toolView') {
        state.toolView = value;
      } else if (key === 'c0' || key === 'c1' || key === 'c2' || key === 'c3') {
        const idx = parseInt(key.slice(1), 10);
        if (idx < state.coeffs.length) {
          state.coeffs[idx] = clamp(Math.round(Number(value)), 0, 6);
        }
      }
    },

    onPointerDown(state, x, y) {
      for (const b of state.buttons) {
        if (hitBox(x, y, b)) {
          b.onClick();
          return;
        }
      }
      for (const st of state.steppers) {
        if (hitBox(x, y, st)) {
          st.onClick();
          return;
        }
      }
    },

    reset(state) {
      const eq = EQUATION_BANK[state.mode][state.eqIndex];
      state.coeffs = new Array(eq.reactants.length + eq.products.length).fill(0);
    },

    update(state) {
      const eq = EQUATION_BANK[state.mode][state.eqIndex];
      let allPositive = true;
      for (let i = 0; i < state.coeffs.length; i++) {
        if (state.coeffs[i] <= 0) allPositive = false;
      }
      let balanced = allPositive;
      for (const el of eq.elements) {
        let leftCount = 0;
        let rightCount = 0;
        eq.reactants.forEach((r, idx) => {
          leftCount += (r.atoms[el] || 0) * (state.coeffs[idx] || 0);
        });
        eq.products.forEach((p, idx) => {
          rightCount += (p.atoms[el] || 0) * (state.coeffs[eq.reactants.length + idx] || 0);
        });
        if (leftCount === 0 || leftCount !== rightCount) {
          balanced = false;
        }
      }
      state.isBalanced = balanced;
      if (balanced && !state.solvedSet[eq.id]) {
        state.solvedSet[eq.id] = true;
        state.score += 20;
      }
    },

            state.coeffs = new Array(e.reactants.length + e.products.length).fill(1);
          }

      const autoBtn = {

        bg: '#065f46',
        border: '#10b981',
        onClick: () => {

      drawPanel(

        166,

        '#111827',
        '#334155'
      );

      const atomCounts = eq.elements.map((el) => {
        let left = 0;
        let right = 0;
        eq.reactants.forEach((r, i) => {
          left += (r.atoms[el] || 0) * (state.coeffs[i] || 0);
        });
        eq.products.forEach((p, i) => {
          right += (p.atoms[el] || 0) * (state.coeffs[eq.reactants.length + i] || 0);
        });
        return { el, left, right };
      });

      const scaleZoneW = state.toolView === 'both' ? 450 : 840;
      if (state.toolView === 'scales' || state.toolView === 'both') {
        const nEl = atomCounts.length;
        const slotW = scaleZoneW / nEl;
        atomCounts.forEach((item, idx) => {
          const cx = 26 + slotW * (idx + 0.5);
          const baseY = 216;
          const pivotY = 166;
          const beamHalf = Math.min(48, slotW * 0.36);
          const diff = clamp(item.right - item.left, -6, 6);
          const tilt = (diff / 6) * 0.32;
          const equal = item.left > 0 && item.left === item.right;

          ctx.beginPath();
          ctx.moveTo(cx, pivotY);
          ctx.lineTo(cx - 14, baseY);
          ctx.lineTo(cx + 14, baseY);
          ctx.closePath();
          ctx.fillStyle = equal ? '#10b981' : '#475569';
          ctx.fill();

          const st = ATOM_STYLE[item.el] || ATOM_STYLE.C;
          drawSphere(ctx, cx, baseY - 12, 10, st.color, st.stroke, item.el);

          ctx.save();
          ctx.translate(cx, pivotY);
          ctx.rotate(tilt);

          ctx.strokeStyle = equal ? '#34d399' : '#94a3b8';
          ctx.lineWidth = 4;
          ctx.beginPath();
          ctx.moveTo(-beamHalf, 0);
          ctx.lineTo(beamHalf, 0);
          ctx.stroke();

          [-beamHalf, beamHalf].forEach((px, sideIdx) => {
            const count = sideIdx === 0 ? item.left : item.right;
            ctx.strokeStyle = '#cbd5e1';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(px, 0);
            ctx.lineTo(px, -10);
            ctx.moveTo(px - 18, -10);
            ctx.lineTo(px + 18, -10);
            ctx.stroke();

            const showAtoms = Math.min(count, 12);
            for (let a = 0; a < showAtoms; a++) {
              const col = a % 3;
              const row = Math.floor(a / 3);
              drawSphere(ctx, px - 8 + col * 8, -16 - row * 8, 4.2, st.color, st.stroke);
            }
          });
          ctx.restore();

          ctx.fillStyle = equal ? '#4ade80' : '#cbd5e1';
          ctx.font = 'bold 11px system-ui, sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(
            `${item.el}: 左 ${item.left} ${equal ? '=' : '≠'} 右 ${item.right}`,
            cx,
            baseY + 11
          );
        });

      if (state.toolView === 'bar' || state.toolView === 'both') {
        const startX = state.toolView === 'both' ? 490 : 60;
        const chartW = state.toolView === 'both' ? 375 : 780;
        const baseY = 208;
        const maxBarH = 92;
        const maxAtoms = Math.max(8, ...atomCounts.map((a) => Math.max(a.left, a.right)));

        ctx.strokeStyle = '#475569';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(startX, baseY);
        ctx.lineTo(startX + chartW, baseY);
        ctx.stroke();

        const groupW = chartW / atomCounts.length;
        atomCounts.forEach((item, idx) => {
          const gx = startX + groupW * (idx + 0.5);
          const st = ATOM_STYLE[item.el] || ATOM_STYLE.C;
          const hL = (item.left / maxAtoms) * maxBarH;
          const hR = (item.right / maxAtoms) * maxBarH;
          const equal = item.left > 0 && item.left === item.right;

          ctx.fillStyle = st.color;
          ctx.fillRect(gx - 20, baseY - hL, 17, hL);
          ctx.strokeStyle = '#f8fafc';
          ctx.lineWidth = 1;
          ctx.strokeRect(gx - 20, baseY - hL, 17, hL);

          ctx.fillStyle = st.color;
          ctx.fillRect(gx + 3, baseY - hR, 17, hR);
          ctx.strokeStyle = equal ? '#4ade80' : '#94a3b8';
          ctx.strokeRect(gx + 3, baseY - hR, 17, hR);

          ctx.fillStyle = '#e2e8f0';
          ctx.font = 'bold 11px system-ui, sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(String(item.left), gx - 11.5, baseY - hL - 6);
          ctx.fillText(String(item.right), gx + 11.5, baseY - hR - 6);

          ctx.fillStyle = equal ? '#4ade80' : '#f87171';
          ctx.font = 'bold 12px system-ui, sans-serif';
          ctx.fillText(equal ? '=' : '≠', gx, baseY + 14);
          ctx.fillStyle = '#cbd5e1';
          ctx.fillText(item.el, gx, baseY - maxBarH - 12);
        });
      }

      if (state.isBalanced) {
        roundRect(ctx, 330, 72, 240, 32, 16);
        ctx.fillStyle = 'rgba(16, 185, 129, 0.95)';
        ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 14px system-ui, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

      }

      drawPanel(ctx, 14, 242, 416, 200, '反应物分子 (Reactants)', '#0f172a', '#3b82f6');
      drawPanel(ctx, 470, 242, 416, 200, '生成物分子 (Products)', '#0f172a', '#10b981');

      ctx.save();
      ctx.fillStyle = state.isBalanced ? '#34d399' : '#64748b';
      ctx.font = 'bold 26px system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('➔', 450, 342);
      ctx.restore();

      const drawSpeciesGroup = (speciesList, coeffOffset, boxX, boxW) => {
        const colW = boxW / speciesList.length;
        speciesList.forEach((sp, sIdx) => {
          const count = state.coeffs[coeffOffset + sIdx] || 0;
          const startX = boxX + sIdx * colW;

          if (sIdx > 0) {
            ctx.strokeStyle = 'rgba(148,163,184,0.2)';
            ctx.beginPath();
            ctx.moveTo(startX, 275);
            ctx.lineTo(startX, 434);
            ctx.stroke();
          }

          const cols = count <= 2 ? 1 : 2;
          for (let m = 0; m < count; m++) {
            const c = m % cols;
            const r = Math.floor(m / cols);
            const mx = startX + colW * (cols === 1 ? 0.5 : 0.3 + c * 0.4);
            const my = 302 + r * 44;
            drawMoleculeIcon(ctx, sp.formula, mx, my, 1.05, 0);
          }

          if (count === 0) {
            ctx.fillStyle = '#475569';
            ctx.font = '12px system-ui, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(`0 × ${sp.label}`, startX + colW / 2, 350);
          }
        });
      };

      drawSpeciesGroup(eq.reactants, 0, 18, 408);
      drawSpeciesGroup(eq.products, eq.reactants.length, 474, 408);

      drawPanel(ctx, 14, 450, 872, 78, null, '#1e293b', state.isBalanced ? '#10b981' : '#475569');

      const allTerms = [
        ...eq.reactants.map((r, i) => ({ ...r, idx: i, side: 'L' })),
        ...eq.products.map((p, i) => ({
          ...p,
          idx: eq.reactants.length + i,
          side: 'R'
        }))
      ];

      const termSpacing = 820 / allTerms.length;
      allTerms.forEach((term, tIdx) => {
        const cx = 55 + termSpacing * (tIdx + 0.5);
        const cy = 489;
        const val = state.coeffs[term.idx] || 0;

        const minusBtn = {
          x: cx - 64,
          y: cy - 16,
          w: 26,
          h: 32,
          label: '−',
          bg: '#334155',
          onClick: () => {
            state.coeffs[term.idx] = clamp(val - 1, 0, 6);
          }
        };
        const plusBtn = {
          x: cx - 6,
          y: cy - 16,
          w: 26,
          h: 32,
          label: '+',
          bg: '#334155',
          onClick: () => {
            state.coeffs[term.idx] = clamp(val + 1, 0, 6);
          }
        };
        state.steppers.push(minusBtn, plusBtn);
        drawButton(ctx, minusBtn, false);
        drawButton(ctx, plusBtn, false);

        roundRect(ctx, cx - 36, cy - 16, 28, 32, 5);
        ctx.fillStyle = '#0f172a';
        ctx.fill();
        ctx.strokeStyle = state.isBalanced ? '#10b981' : '#38bdf8';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        ctx.fillStyle = '#f8fafc';
        ctx.font = 'bold 18px system-ui, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(String(val), cx - 22, cy);

        ctx.fillStyle = '#e2e8f0';
        ctx.font = 'bold 20px system-ui, sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText(term.label, cx + 26, cy + 1);

        if (tIdx < allTerms.length - 1) {
          const nextTerm = allTerms[tIdx + 1];
          const opX = cx + termSpacing / 2 + 12;
          ctx.fillStyle = '#94a3b8';
          ctx.font = 'bold 22px system-ui, sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(term.side !== nextTerm.side ? '⟶' : '+', opX, cy);
        }
      });
    }
  });

        state.revealed = false;
      } else if (key === 'r0' || key === 'r1' || key === 'r2') {
        const i = parseInt(key.slice(1), 10);
        state.rCounts[i] = clamp(Math.round(Number(value)), 0, 10);

        state.gameMode = Boolean(value);

      for (const b of state.buttons) {
        if (hitBox(x, y, b)) {

      for (const st of state.steppers) {

      const sc = RPL_SCENARIOS[state.scenarioIdx];

        if (possible < extent) {
          extent = possible;
          limitingIdx = idx;
        }
      });
      if (!isFinite(extent)) extent = 0;
      state.extent = extent;
      state.limitingIdx = extent > 0 ? limitingIdx : -1;
      state.productCounts = sc.products.map((p) => extent * p.coeff);
      state.leftoverCounts = sc.reactants.map(
        (r, idx) => (state.rCounts[idx] || 0) - extent * r.coeff

    }
  };

  function createMatterParticles(substanceKey, phase, count, box) {
    const sub = MATTER_SUBSTANCES[substanceKey] || MATTER_SUBSTANCES.neon;
    const particles = [];
    const cx = (box.left + box.right) / 2;
    const bottom = box.bottom;

    if (substanceKey === 'water' && phase === 'solid') {
      const ringR = 26;
      const centers = [
        { rx: -62, ry: bottom - 55 },
        { rx: 0, ry: bottom - 55 },
        { rx: 62, ry: bottom - 55 },
        { rx: -31, ry: bottom - 108 },
        { rx: 31, ry: bottom - 108 },
        { rx: -62, ry: bottom - 160 },
        { rx: 0, ry: bottom - 160 },
        { rx: 62, ry: bottom - 160 }
      ];
      const coords = [];
      const seen = [];
      for (const c of centers) {
        for (let k = 0; k < 6; k++) {
          const ang = (k * Math.PI) / 3 + Math.PI / 6;
          const px = cx + c.rx + Math.cos(ang) * ringR;
          const py = c.ry + Math.sin(ang) * ringR;
          let dup = false;
          for (const s of seen) {
            if (Math.hypot(s.x - px, s.y - py) < 12) {
              dup = true;
              break;
            }
          }
          if (!dup) {
            seen.push({ x: px, y: py });
            coords.push({ x: px, y: py, angle: ang + Math.PI / 2 });
          }
        }
      }
      const n = Math.min(count, coords.length);
      for (let i = 0; i < n; i++) {
        particles.push({
          x: coords[i].x,
          y: coords[i].y,
          anchorX: coords[i].x,
          anchorY: coords[i].y,
          vx: (Math.random() - 0.5) * 4,
          vy: (Math.random() - 0.5) * 4,
          angle: coords[i].angle,
          omega: 0
        });
      }
      return particles;
    }

    if (phase === 'solid') {
      const cols = 7;
      const dx = sub.sigma * 1.05;
      const dy = sub.sigma * 0.91;
      for (let i = 0; i < count; i++) {
        const r = Math.floor(i / cols);
        const c = i % cols;
        const px = cx - ((cols - 1) * dx) / 2 + c * dx + (r % 2) * (dx * 0.5);
        const py = bottom - 20 - r * dy;
        particles.push({
          x: px,
          y: py,
          anchorX: px,
          anchorY: py,
          vx: (Math.random() - 0.5) * 5,
          vy: (Math.random() - 0.5) * 5,
          angle: (i * 0.7) % (Math.PI * 2),
          omega: (Math.random() - 0.5) * 0.5
        });
      }
    } else if (phase === 'liquid') {
      const cols = 9;
      const dx = sub.sigma * (substanceKey === 'water' ? 0.96 : 1.12);
      const dy = sub.sigma * (substanceKey === 'water' ? 0.92 : 1.04);
      for (let i = 0; i < count; i++) {
        const r = Math.floor(i / cols);
        const c = i % cols;
        const px = cx - ((cols - 1) * dx) / 2 + c * dx + (Math.random() - 0.5) * 4;
        const py = bottom - 18 - r * dy;
        particles.push({
          x: px,
          y: py,
          anchorX: null,
          anchorY: null,
          vx: (Math.random() - 0.5) * 35,
          vy: (Math.random() - 0.5) * 35,
          angle: Math.random() * Math.PI * 2,
          omega: (Math.random() - 0.5) * 2
        });
      }
    } else {
      for (let i = 0; i < count; i++) {
        particles.push({
          x: box.left + 24 + Math.random() * (box.right - box.left - 48),
          y: box.top + 24 + Math.random() * (box.bottom - box.top - 48),
          anchorX: null,
          anchorY: null,
          vx: (Math.random() - 0.5) * 140,
          vy: (Math.random() - 0.5) * 140,
          angle: Math.random() * Math.PI * 2,
          omega: (Math.random() - 0.5) * 4
        });
      }
    }
    return particles;
  }

  function stepMatterSimulation(state, dt) {
    const dtClamped = Math.min(dt || 0.016, 0.025);
    const sub = MATTER_SUBSTANCES[state.substance] || MATTER_SUBSTANCES.neon;
    const box = state.box;

    if (Math.abs(state.heatLevel) > 0.02) {
      state.tempK = clamp(state.tempK + state.heatLevel * 55 * dtClamped, 5, 700);
    }

    const meltT = sub.tripleT;
    const boilT = sub.tripleT * 1.85;
    if (state.tempK < meltT * 0.92) {
      state.currentPhase = 'solid';
    } else if (state.tempK < boilT) {
      state.currentPhase = 'liquid';
    } else {
      state.currentPhase = 'gas';
    }

    if (state.substance === 'water' && state.currentPhase === 'solid' && !state.hasIceAnchors) {
      const templ = createMatterParticles('water', 'solid', state.particles.length, box);
      state.particles.forEach((p, idx) => {
        const t = templ[idx % templ.length];
        p.anchorX = t.anchorX;
        p.anchorY = t.anchorY;
      });
      state.hasIceAnchors = true;
    } else if (state.currentPhase !== 'solid') {
      state.hasIceAnchors = false;
    }

    const n = state.particles.length;
    const sigma = sub.sigma;
    const eps = sub.epsilon * 2400;
    const targetSpeed = Math.sqrt(state.tempK) * 6.8;
    let wallImpulse = 0;

    const fx = new Float64Array(n);
    const fy = new Float64Array(n);

    for (let i = 0; i < n; i++) {
      fy[i] += state.currentPhase === 'gas' ? 18 : 95;
      const p = state.particles[i];
      if (state.substance === 'water' && state.currentPhase === 'solid' && p.anchorX != null) {
        fx[i] += (p.anchorX - p.x) * 45;
        fy[i] += (p.anchorY - p.y) * 45;
      }
    }

    for (let i = 0; i < n; i++) {
      const pi = state.particles[i];
      for (let j = i + 1; j < n; j++) {
        const pj = state.particles[j];
        const dx = pj.x - pi.x;
        const dy = pj.y - pi.y;
        const distSq = dx * dx + dy * dy;
        const minDist = sigma * 0.86;
        const cutDist = sigma * 2.6;
        if (distSq < cutDist * cutDist && distSq > 0.01) {
          const dist = Math.sqrt(distSq);
          const effD = Math.max(dist, minDist);
          const sr = sigma / effD;
          const sr6 = sr * sr * sr * sr * sr * sr;
          let fMag = clamp((24 * eps * (2 * sr6 * sr6 - sr6)) / effD, -1800, 1200);
          if (state.substance === 'water' && state.currentPhase === 'solid') {
            fMag *= 0.25;
          }
          const ux = dx / dist;
          const uy = dy / dist;
          fx[i] -= fMag * ux;
          fy[i] -= fMag * uy;
          fx[j] += fMag * ux;
          fy[j] += fMag * uy;
        }
      }
    }

    const r = sigma * 0.48;
    for (let i = 0; i < n; i++) {
      const p = state.particles[i];
      p.vx += fx[i] * dtClamped;
      p.vy += fy[i] * dtClamped;

      const spd = Math.hypot(p.vx, p.vy) || 1;
      const blend = 0.12;
      const desired = state.currentPhase === 'solid' ? targetSpeed * 0.32 : targetSpeed;
      const scale = 1 + ((desired - spd) / spd) * blend;
      p.vx *= scale;
      p.vy *= scale;

      p.x += p.vx * dtClamped;
      p.y += p.vy * dtClamped;
      p.angle += p.omega * dtClamped;

      if (p.x < box.left + r) {
        p.x = box.left + r;
        p.vx = Math.abs(p.vx);
        wallImpulse += Math.abs(p.vx);
      } else if (p.x > box.right - r) {
        p.x = box.right - r;
        p.vx = -Math.abs(p.vx);
        wallImpulse += Math.abs(p.vx);
      }

      if (p.y < box.top + r) {
        p.y = box.top + r;
        p.vy = Math.abs(p.vy);
        wallImpulse += Math.abs(p.vy);
      } else if (p.y > box.bottom - r) {
        p.y = box.bottom - r;
        p.vy = -Math.abs(p.vy) * 0.9;
        wallImpulse += Math.abs(p.vy);
      }
    }

    const volFrac = Math.max(0.18, (box.bottom - box.top) / 280);
    const rawP = ((n / 36) * (state.tempK / 273.15)) / volFrac + wallImpulse * 0.0005;
    state.pressureAtm = state.pressureAtm * 0.9 + rawP * 0.1;
  }

  function drawMatterParticle(ctx, substanceKey, p) {
    if (substanceKey === 'neon') {
      drawSphere(ctx, p.x, p.y, 9.5, ATOM_STYLE.Ne.color, ATOM_STYLE.Ne.stroke);
    } else if (substanceKey === 'argon') {
      drawSphere(ctx, p.x, p.y, 11.5, ATOM_STYLE.Ar.color, ATOM_STYLE.Ar.stroke);
    } else if (substanceKey === 'oxygen') {
      drawMoleculeIcon(ctx, 'O2', p.x, p.y, 0.72, p.angle);
    } else if (substanceKey === 'water') {
      drawMoleculeIcon(ctx, 'H2O', p.x, p.y, 0.78, p.angle);
    }
  }

  // ============================================================================
  // SHARED KINETIC THEORY OF GASES ENGINE FOR SIMS 5 & 6
  // ============================================================================
  function spawnGasParticle(type, leftX, rightX, topY, bottomY, tempK) {
    const isHeavy = type === 'heavy';
    const mass = isHeavy ? 28 : 4;
    const radius = isHeavy ? 7.5 : 4.5;
    const baseSpeed = Math.sqrt(tempK / mass) * 42;
    const u1 = Math.max(1e-5, Math.random());
    const u2 = Math.random();
    const speed = baseSpeed * Math.sqrt(-Math.log(u1)) * 0.95;
    const theta = u2 * Math.PI * 2;
    return {
      type,
      mass,
      r: radius,
      x: leftX + radius + 6 + Math.random() * Math.max(20, rightX - leftX - 2 * radius - 12),
      y: topY + radius + 6 + Math.random() * Math.max(20, bottomY - topY - 2 * radius - 12),
      vx: Math.cos(theta) * speed,
      vy: Math.sin(theta) * speed
    };
  }

  function syncGasCount(particles, type, targetCount, leftX, rightX, topY, bottomY, tempK) {
    const current = particles.filter((p) => p.type === type);
    if (current.length < targetCount) {
      const toAdd = targetCount - current.length;
      for (let i = 0; i < toAdd; i++) {
        particles.push(spawnGasParticle(type, leftX, rightX, topY, bottomY, tempK));
      }
    } else if (current.length > targetCount) {
      let removeCount = current.length - targetCount;
      for (let i = particles.length - 1; i >= 0 && removeCount > 0; i--) {
        if (particles[i].type === type) {
          particles.splice(i, 1);
          removeCount--;
        }
      }
    }
  }

  function stepIdealGasBox(state, dt) {
    const dtC = Math.min(dt || 0.016, 0.025);
    const topY = 92;
    const bottomY = 392;
    const rightX = 510;
    let leftX = rightX - state.boxWidth;

    if (Math.abs(state.heatLevel) > 0.02 && state.holdConstant !== 'T') {
      state.tempK = clamp(state.tempK + state.heatLevel * 65 * dtC, 50, 1000);
    }

    const N = state.particles.length;

    if (state.holdConstant === 'P' && N > 0) {
      const targetP = state.targetPressureAtm || 12.0;
      const desiredWidth = clamp((N * state.tempK * 0.25) / Math.max(1, targetP), 160, 420);
      state.boxWidth = state.boxWidth * 0.9 + desiredWidth * 0.1;
      leftX = rightX - state.boxWidth;
    }

    let wallHitsThisStep = 0;

    for (let i = state.particles.length - 1; i >= 0; i--) {
      const p = state.particles[i];
      const targetRms = Math.sqrt(state.tempK / p.mass) * 42;
      const curSpd = Math.hypot(p.vx, p.vy) || 1;
      p.x += p.vx * dtC;
      p.y += p.vy * dtC;

      if (p.x - p.r < leftX) {
        if (state.lidOpen && p.y > topY + 8 && p.y < topY + 66) {
          if (p.x < leftX - 35) {
            if (p.type === 'heavy') state.heavyCount = Math.max(0, state.heavyCount - 1);
            else state.lightCount = Math.max(0, state.lightCount - 1);
            state.particles.splice(i, 1);
            continue;
          }
        } else {
          p.x = leftX + p.r;
          p.vx = Math.abs(p.vx);
          wallHitsThisStep++;
        }
      } else if (p.x + p.r > rightX) {
        p.x = rightX - p.r;
        p.vx = -Math.abs(p.vx);
        wallHitsThisStep++;
      }

      if (p.y - p.r < topY) {
        p.y = topY + p.r;
        p.vy = Math.abs(p.vy);
        wallHitsThisStep++;
      } else if (p.y + p.r > bottomY) {
        p.y = bottomY - p.r;
        p.vy = -Math.abs(p.vy);
        wallHitsThisStep++;
      }

      const sFactor = 1 + ((targetRms - curSpd) / Math.max(20, curSpd)) * 0.015;
      p.vx *= sFactor;
      p.vy *= sFactor;
    }

    const len = state.particles.length;
    for (let i = 0; i < len; i++) {
      const p1 = state.particles[i];
      for (let j = i + 1; j < len; j++) {
        const p2 = state.particles[j];
        const dx = p2.x - p1.x;
        const dy = p2.y - p1.y;
        const minDist = p1.r + p2.r;
        if (dx * dx + dy * dy < minDist * minDist) {
          const dist = Math.hypot(dx, dy) || 0.1;
          const nx = dx / dist;
          const ny = dy / dist;
          const overlap = minDist - dist;
          p1.x -= nx * overlap * 0.5;
          p1.y -= ny * overlap * 0.5;
          p2.x += nx * overlap * 0.5;
          p2.y += ny * overlap * 0.5;

          const dvx = p1.vx - p2.vx;
          const dvy = p1.vy - p2.vy;
          const vn = dvx * nx + dvy * ny;
          if (vn > 0) {
            const impulse = (2 * vn) / (1 / p1.mass + 1 / p2.mass);
            p1.vx -= (impulse / p1.mass) * nx;
            p1.vy -= (impulse / p1.mass) * ny;
            p2.vx += (impulse / p2.mass) * nx;
            p2.vy += (impulse / p2.mass) * ny;
          }
        }
      }
    }

    state.collisionHistory.push(wallHitsThisStep);
    if (state.collisionHistory.length > 60) state.collisionHistory.shift();
    state.wallCollisions = state.collisionHistory.reduce((a, b) => a + b, 0);

    const volNm = state.boxWidth / 30;
    const pIdeal = (state.particles.length * state.tempK * 0.0082) / Math.max(1, volNm);
    state.pressureAtm = state.pressureAtm * 0.85 + pIdeal * 0.15;
  }

  // ============================================================================

  register('gas-properties', {
    title: '气体性质与麦克斯韦速率分布 (Gas Properties)',
    init() {
      const state = {
        heavyCount: 35,
        lightCount: 25,
        boxWidth: 310,
        tempK: 320,
        heatLevel: 0,
        holdConstant: 'none',
        targetPressureAtm: 14.0,
        lidOpen: false,
        pressureUnit: 'atm',

        wallCollisions: 0,
        collisionHistory: [],
        draggingWall: false,

        particles: [],
        buttons: []
      };
      syncGasCount(state.particles, 'heavy', state.heavyCount, 510 - state.boxWidth, 510, 92, 392, state.tempK);
      syncGasCount(state.particles, 'light', state.lightCount, 510 - state.boxWidth, 510, 92, 392, state.tempK);

          { value: 'T', label: '恒定温度 (Temperature T)' },

        default: 'none'

      }

    onParamChange(state, key, value) {
      const leftX = 510 - state.boxWidth;
      if (key === 'holdConstant') {
        state.holdConstant = value;
        if (value === 'P') state.targetPressureAtm = Math.max(4, state.pressureAtm);
      } else if (key === 'heavyCount') {
        state.heavyCount = clamp(Math.round(Number(value)), 0, 80);
        syncGasCount(state.particles, 'heavy', state.heavyCount, leftX, 510, 92, 392, state.tempK);
      } else if (key === 'lightCount') {
        state.lightCount = clamp(Math.round(Number(value)), 0, 80);
        syncGasCount(state.particles, 'light', state.lightCount, leftX, 510, 92, 392, state.tempK);
      } else if (key === 'tempK') {
        state.tempK = clamp(Number(value), 60, 900);
      } else if (key === 'lidOpen') {
        state.lidOpen = Boolean(value);
      }
    },

    onPointerDown(state, x, y) {
      for (const b of state.buttons) {
        if (hitBox(x, y, b)) {
          b.onClick();
          return;
        }
      }
      const leftX = 510 - state.boxWidth;
      if (
        state.holdConstant !== 'V' &&
        state.holdConstant !== 'P' &&
        Math.abs(x - leftX) <= 22 &&
        y >= 92 &&
        y <= 392
      ) {
        state.draggingWall = true;
      }
    },

    onPointerMove(state, x) {
      if (state.draggingWall && state.holdConstant !== 'V' && state.holdConstant !== 'P') {
        state.boxWidth = clamp(510 - x, 160, 420);
      }
    },

    onPointerUp(state) {
      state.draggingWall = false;

    reset(state) {

      state.lightCount = 25;
      state.boxWidth = 310;
      state.tempK = 320;
      state.lidOpen = false;
      state.holdConstant = 'none';
      state.particles = [];
      syncGasCount(state.particles, 'heavy', 35, 200, 510, 92, 392, 320);
      syncGasCount(state.particles, 'light', 25, 200, 510, 92, 392, 320);
    },

    update(state, dt) {
      stepIdealGasBox(state, dt);

      const nBins = state.smoothBinsAll.length;
      const maxSpeed = 650;
      const rawAll = new Array(nBins).fill(0);
      const rawH = new Array(nBins).fill(0);
      const rawL = new Array(nBins).fill(0);

      for (const p of state.particles) {
        const v = Math.hypot(p.vx, p.vy);
        const bin = clamp(Math.floor((v / maxSpeed) * nBins), 0, nBins - 1);
        rawAll[bin]++;
        if (p.type === 'heavy') rawH[bin]++;
        else rawL[bin]++;
      }

      for (let b = 0; b < nBins; b++) {
        state.smoothBinsAll[b] = state.smoothBinsAll[b] * 0.88 + rawAll[b] * 0.12;
        state.smoothBinsHeavy[b] = state.smoothBinsHeavy[b] * 0.88 + rawH[b] * 0.12;
        state.smoothBinsLight[b] = state.smoothBinsLight[b] * 0.88 + rawL[b] * 0.12;
      }
    },

    render(ctx, canvas, state) {
      const W = 900;
      const H = 540;

      ctx.strokeStyle = '#94a3b8';

          bg: '#b45309',
          onClick: () => {

          y: bottomY + 34,
          w: 76,
          h: 32,
          label: '❄️ 降温 −',
          bg: '#0369a1',

      const modes = [
        { id: 'none', label: '🔓 无约束' },

      modes.forEach((m, idx) => {
        const btn = {

          const py = gy + gh - clamp(fv * count * 310, 0, gh - 6);

  // ============================================================================
  // 7. DIFFUSION ('diffusion') - Two-Chamber Graham's Law Gas Diffusion
  // ============================================================================
  function buildDiffusionParticles(state) {
    const particles = [];
    const box = state.box;
    const midX = (box.left + box.right) / 2;

    const addSide = (side, count, mass, radius, tempK) => {
      const xMin = side === 'left' ? box.left + radius + 4 : midX + radius + 6;
      const xMax = side === 'left' ? midX - radius - 6 : box.right - radius - 4;
      const baseSpeed = Math.sqrt(tempK / mass) * 44;

      for (let i = 0; i < count; i++) {
        const ang = Math.random() * Math.PI * 2;
        particles.push({
          side,
          mass,
          r: radius,
          x: xMin + Math.random() * Math.max(10, xMax - xMin),
          y: box.top + radius + 4 + Math.random() * (box.bottom - box.top - 2 * radius - 8),
          vx: Math.cos(ang) * baseSpeed,
          vy: Math.sin(ang) * baseSpeed
        });
      }
    };

    addSide('left', state.n1, state.m1, state.r1, state.t1);
    addSide('right', state.n2, state.m2, state.r2, state.t2);
    return particles;
  }

  register('diffusion', {
    title: '气体扩散与格雷厄姆定律 (Diffusion)',

    controls: [

    onParamChange(state, key, value) {

    reset(state) {

    update(state, dt) {
      const dtC = Math.min(dt || 0.016, 0.025);
      if (state.dividerRemoved) {
        state.elapsedSec += dtC;
      }

      const box = state.box;
      const midX = (box.left + box.right) / 2;
      const len = state.particles.length;

      for (let i = 0; i < len; i++) {
        const p = state.particles[i];
        const prevX = p.x;
        p.x += p.vx * dtC;
        p.y += p.vy * dtC;

        if (p.x - p.r < box.left) {
          p.x = box.left + p.r;
          p.vx = Math.abs(p.vx);
        } else if (p.x + p.r > box.right) {
          p.x = box.right - p.r;
          p.vx = -Math.abs(p.vx);
        }

        if (p.y - p.r < box.top) {
          p.y = box.top + p.r;
          p.vy = Math.abs(p.vy);
        } else if (p.y + p.r > box.bottom) {
          p.y = box.bottom - p.r;
          p.vy = -Math.abs(p.vy);
        }

        if (!state.dividerRemoved) {
          if (prevX <= midX && p.x + p.r > midX - 3) {
            p.x = midX - 3 - p.r;
            p.vx = -Math.abs(p.vx);
          } else if (prevX >= midX && p.x - p.r < midX + 3) {
            p.x = midX + 3 + p.r;
            p.vx = Math.abs(p.vx);
          }
        }
      }

      for (let i = 0; i < len; i++) {
        const p1 = state.particles[i];
        for (let j = i + 1; j < len; j++) {
          const p2 = state.particles[j];
          if (!state.dividerRemoved && (p1.x - midX) * (p2.x - midX) < 0) continue;

          const dx = p2.x - p1.x;
          const dy = p2.y - p1.y;
          const minDist = p1.r + p2.r;
          if (dx * dx + dy * dy < minDist * minDist) {
            const dist = Math.hypot(dx, dy) || 0.1;
            const nx = dx / dist;
            const ny = dy / dist;
            const overlap = minDist - dist;
            p1.x -= nx * overlap * 0.5;
            p1.y -= ny * overlap * 0.5;
            p2.x += nx * overlap * 0.5;
            p2.y += ny * overlap * 0.5;

            const dvx = p1.vx - p2.vx;
            const dvy = p1.vy - p2.vy;
            const vn = dvx * nx + dvy * ny;
            if (vn > 0) {
              const imp = (2 * vn) / (1 / p1.mass + 1 / p2.mass);
              p1.vx -= (imp / p1.mass) * nx;
              p1.vy -= (imp / p1.mass) * ny;
              p2.vx += (imp / p2.mass) * nx;
              p2.vy += (imp / p2.mass) * ny;
            }
          }
        }
      }
    },

        } else {

      const comBlueX = cntBlue > 0 ? sumBlueX / cntBlue : (box.left + midX) / 2;

      drawPanel(ctx, 14, 14, 532, 72, null, '#1e293b', '#334155');

/**

 * 7. 'ph-scale'                 - pH标度 (Macro / Micro / My Solution, [H3O+]/[OH-]/[H2O] Log/Linear & Ions)
 */

(function () {
  'use strict';

  const W = 900;
  const H = 540;
  const G_ACCEL = 9.8; // m/s^2
  const KW_25C = 1.0e-14; // [H3O+][OH-] at 25°C
  const NA_AVOGADRO = 6.022e23;

  // Ensure window.registerSim exists even if loaded standalone before engine.js
  if (typeof window !== 'undefined' && typeof window.registerSim !== 'function') {
    window.__registeredSims = window.__registeredSims || {};
    window.registerSim = function (id, config) {
      window.__registeredSims[id] = config;
    };
  }

  // ============================================================================
  // SHARED UTILITIES & UNIVERSAL ENGINE ADAPTER
  // ============================================================================

  function clamp(val, min, max) {
    const n = Number(val);
    if (!Number.isFinite(n)) return min;
    return Math.max(min, Math.min(max, n));
  }

  function lerp(a, b, t) {
    return a + (b - a) * clamp(t, 0, 1);
  }

  function clampDt(dt) {
    const n = Number(dt);
    if (!Number.isFinite(n) || n <= 0) return 0.016;
    const sec = n > 1.0 ? n / 1000 : n;
    return clamp(sec, 0.001, 0.05);
  }

  function hexToRgb(hex) {
    const clean = String(hex || '#3b82f6').replace('#', '');
    const num = parseInt(clean.length === 3
      ? clean.split('').map(c => c + c).join('')
      : clean, 16);
    return {
      r: (num >> 16) & 255,
      g: (num >> 8) & 255,
      b: num & 255
    };
  }

  function rgbaStr(hex, alpha) {
    const { r, g, b } = hexToRgb(hex);
    return `rgba(${r}, ${g}, ${b}, ${clamp(alpha, 0, 1).toFixed(3)})`;
  }

  function mixHex(hex1, hex2, t) {
    const c1 = hexToRgb(hex1);
    const c2 = hexToRgb(hex2);
    const u = clamp(t, 0, 1);
    const r = Math.round(c1.r + (c2.r - c1.r) * u);
    const g = Math.round(c1.g + (c2.g - c1.g) * u);
    const b = Math.round(c1.b + (c2.b - c1.b) * u);
    return `rgb(${r}, ${g}, ${b})`;
  }

  // Convert visible wavelength (380 - 780 nm) to physically accurate RGB
  function wavelengthToRgb(nm) {
    const w = clamp(nm, 380, 780);
    let r = 0, g = 0, b = 0;
    if (w >= 380 && w < 440) {
      r = -(w - 440) / (440 - 380);
      g = 0;
      b = 1;
    } else if (w >= 440 && w < 490) {
      r = 0;
      g = (w - 440) / (490 - 440);
      b = 1;
    } else if (w >= 490 && w < 510) {
      r = 0;
      g = 1;
      b = -(w - 510) / (510 - 490);
    } else if (w >= 510 && w < 580) {
      r = (w - 510) / (580 - 510);
      g = 1;
      b = 0;
    } else if (w >= 580 && w < 645) {
      r = 1;
      g = -(w - 645) / (645 - 580);
      b = 0;
    } else if (w >= 645 && w <= 780) {
      r = 1;
      g = 0;
      b = 0;
    }

    let factor = 1.0;
    if (w >= 380 && w < 420) {
      factor = 0.3 + 0.7 * (w - 380) / (420 - 380);
    } else if (w > 700 && w <= 780) {
      factor = 0.3 + 0.7 * (780 - w) / (780 - 700);
    }

    const R = Math.round(255 * Math.pow(r * factor, 0.8));
    const G = Math.round(255 * Math.pow(g * factor, 0.8));
    const B = Math.round(255 * Math.pow(b * factor, 0.8));
    return { r: R, g: G, b: B, css: `rgb(${R}, ${G}, ${B})` };
  }

  function formatSci(val, digits = 2) {
    const n = Number(val);
    if (!Number.isFinite(n) || n === 0) return '0';
    const exp = Math.floor(Math.log10(Math.abs(n)));
    if (exp >= -2 && exp <= 3) {
      return n.toFixed(Math.max(0, digits - exp));
    }
    const mant = (n / Math.pow(10, exp)).toFixed(digits);
    const supMap = {
      '-': '⁻', '0': '⁰', '1': '¹', '2': '²', '3': '³',
      '4': '⁴', '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹'
    };
    const expStr = String(exp).split('').map(ch => supMap[ch] || ch).join('');
    return `${mant}×10${expStr}`;
  }

  function roundRect(ctx, x, y, w, h, r = 8) {
    const radius = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + radius, y);
    ctx.arcTo(x + w, y, x + w, y + h, radius);
    ctx.arcTo(x + w, y + h, x, y + h, radius);
    ctx.arcTo(x, y + h, x, y, radius);
    ctx.arcTo(x, y, x + w, y, radius);
    ctx.closePath();
  }

  function fillStrokeRoundRect(ctx, x, y, w, h, r, fillStyle, strokeStyle, lineWidth = 1.5) {
    roundRect(ctx, x, y, w, h, r);
    if (fillStyle) {
      ctx.fillStyle = fillStyle;
      ctx.fill();
    }
    if (strokeStyle) {
      ctx.strokeStyle = strokeStyle;
      ctx.lineWidth = lineWidth;
      ctx.stroke();
    }
  }

  function drawVectorArrow(ctx, x1, y1, x2, y2, color, label, labelSide = 'right') {
    const dx = x2 - x1;
    const dy = y2 - y1;
    const len = Math.hypot(dx, dy);
    if (len < 3) return;
    const angle = Math.atan2(dy, dx);
    const headLen = Math.min(11, Math.max(6, len * 0.28));

    ctx.save();
    ctx.strokeStyle = color;
    ctx.fillStyle = color;
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';

    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2 - Math.cos(angle) * (headLen * 0.6), y2 - Math.sin(angle) * (headLen * 0.6));
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(x2, y2);
    ctx.lineTo(x2 - headLen * Math.cos(angle - Math.PI / 6), y2 - headLen * Math.sin(angle - Math.PI / 6));
    ctx.lineTo(x2 - headLen * Math.cos(angle + Math.PI / 6), y2 - headLen * Math.sin(angle + Math.PI / 6));
    ctx.closePath();
    ctx.fill();

    if (label) {
      ctx.font = 'bold 11px "Inter", "PingFang SC", sans-serif';
      const tw = ctx.measureText(label).width;
      const lx = labelSide === 'left' ? x2 - tw - 14 : x2 + 8;
      const ly = y2 + 4;
      fillStrokeRoundRect(ctx, lx - 4, ly - 11, tw + 8, 15, 4, 'rgba(15,23,42,0.82)', color, 1);
      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'alphabetic';
      ctx.fillText(label, lx, ly);
    }
    ctx.restore();
  }

  function drawCanvasSlider(ctx, uiRegions, cfg) {
    const {
      id, x, y, w, label, value, min, max, step = 0.01, unit = '',
      color = '#3b82f6', formatVal, onChange
    } = cfg;
    const ratio = clamp((value - min) / ((max - min) || 1), 0, 1);

    ctx.save();
    ctx.font = '600 11.5px "Inter", "PingFang SC", sans-serif';
    ctx.fillStyle = '#1e293b';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillText(label, x, y - 7);

    const valText = formatVal ? formatVal(value) : `${Number(value).toFixed(step >= 1 ? 0 : step >= 0.1 ? 1 : 2)}${unit ? ' ' + unit : ''}`;
    ctx.fillStyle = color;
    ctx.textAlign = 'right';
    ctx.fillText(valText, x + w, y - 7);

    const trackY = y + 3;
    fillStrokeRoundRect(ctx, x, trackY - 3, w, 6, 3, '#e2e8f0', '#cbd5e1', 1);
    if (ratio > 0) {
      fillStrokeRoundRect(ctx, x, trackY - 3, Math.max(6, w * ratio), 6, 3, color, null, 0);
    }

    const tx = x + w * ratio;
    ctx.beginPath();
    ctx.arc(tx, trackY, 7.5, 0, Math.PI * 2);
    ctx.fillStyle = '#ffffff';
    ctx.fill();
    ctx.lineWidth = 2.2;
    ctx.strokeStyle = color;
    ctx.stroke();
    ctx.restore();

    if (uiRegions) {
      uiRegions.push({
        id,
        type: 'slider',
        x: x - 8,
        y: y - 16,
        w: w + 16,
        h: 30,
        trackX: x,
        trackW: w,
        min,
        max,
        step,
        onChange
      });
    }
  }

  function drawCanvasButton(ctx, uiRegions, cfg) {
    const {
      id, x, y, w, h = 26, label, active = false,
      activeBg = '#2563eb', activeFg = '#ffffff',
      bg = '#f1f5f9', fg = '#334155', border = '#cbd5e1',
      fontSize = 11.5, r = 6, onClick
    } = cfg;
    ctx.save();
    fillStrokeRoundRect(
      ctx, x, y, w, h, r,
      active ? activeBg : bg,
      active ? activeBg : border,
      active ? 1.5 : 1
    );
    ctx.font = `${active ? 'bold' : '600'} ${fontSize}px "Inter", "PingFang SC", sans-serif`;
    ctx.fillStyle = active ? activeFg : fg;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(label, x + w / 2, y + h / 2 + 0.5);
    ctx.restore();

    if (uiRegions && onClick) {
      uiRegions.push({
        id,
        type: 'button',
        x, y, w, h,
        onClick
      });
    }
  }

  function drawCanvasCheckbox(ctx, uiRegions, cfg) {
    const { id, x, y, label, checked, color = '#2563eb', onChange } = cfg;
    ctx.save();
    fillStrokeRoundRect(ctx, x, y, 16, 16, 4, checked ? color : '#ffffff', checked ? color : '#94a3b8', 1.5);
    if (checked) {
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(x + 3.5, y + 8.5);
      ctx.lineTo(x + 7, y + 12);
      ctx.lineTo(x + 12.5, y + 4.5);
      ctx.stroke();
    }
    ctx.font = '600 11.5px "Inter", "PingFang SC", sans-serif';
    ctx.fillStyle = '#1e293b';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(label, x + 22, y + 8.5);
    const tw = ctx.measureText(label).width;
    ctx.restore();

    if (uiRegions && onChange) {
      uiRegions.push({
        id,
        type: 'button',
        x: x - 2,
        y: y - 2,
        w: 26 + tw,
        h: 20,
        onClick: () => onChange(!checked)
      });
    }
  }

  function createUniversalSim(simDef) {
    let internalState = simDef.createState();
    let lastCanvas = null;
    let lastPointerStamp = 0;

    function resolveCtx(args) {
      for (let i = 0; i < args.length; i++) {
        const a = args[i];
        if (a && typeof a.fillRect === 'function' && typeof a.beginPath === 'function') {
          return a;
        }
      }
      return null;
    }

    function resolveState(args) {
      for (let i = 0; i < args.length; i++) {
        const a = args[i];
        if (
          a &&
          typeof a === 'object' &&
          typeof a.fillRect !== 'function' &&
          !(typeof HTMLElement !== 'undefined' && a instanceof HTMLElement) &&
          typeof a.preventDefault !== 'function'
        ) {
          if (!a.__simInitialized || a.__simId !== simDef.id) {
            const fresh = simDef.createState();
            Object.assign(a, fresh);
            a.__simInitialized = true;
            a.__simId = simDef.id;
          }
          internalState = a;
          return a;
        }
      }
      return internalState;
    }

    function resolveDt(args) {
      for (let i = 0; i < args.length; i++) {
        if (typeof args[i] === 'number' && args[i] < 200) {
          return clampDt(args[i]);
        }
      }
      return 0.016;
    }

    function resolvePointer(args) {
      let x = null, y = null;
      for (let i = 0; i < args.length; i++) {
        const a = args[i];
        if (typeof a === 'number') {
          if (x === null) x = a;
          else if (y === null) y = a;
        } else if (a && typeof a === 'object') {
          if (typeof a.x === 'number' && typeof a.y === 'number') {
            x = a.x;
            y = a.y;
            break;
          }
          if (typeof a.clientX === 'number' && typeof a.clientY === 'number' && lastCanvas) {
            const rect = lastCanvas.getBoundingClientRect();
            if (rect.width > 0 && rect.height > 0) {
              x = (a.clientX - rect.left) * (W / rect.width);
              y = (a.clientY - rect.top) * (H / rect.height);
              break;
            }
          }
          if (typeof a.offsetX === 'number' && typeof a.offsetY === 'number') {
            const cw = lastCanvas ? (lastCanvas.clientWidth || W) : W;
            const ch = lastCanvas ? (lastCanvas.clientHeight || H) : H;
            x = a.offsetX * (W / cw);
            y = a.offsetY * (H / ch);
            break;
          }
        }
      }
      return {
        x: clamp(x ?? 0, 0, W),
        y: clamp(y ?? 0, 0, H)
      };
    }

    function bindCanvasOnce(canvas) {
      if (!canvas || typeof canvas.addEventListener !== 'function') return;
      canvas.__activeSimWrapper = wrapper;
      if (canvas.__phetUniversalBound) return;
      canvas.__phetUniversalBound = true;

      const getCoords = (e) => {
        const rect = canvas.getBoundingClientRect();
        const touch = (e.touches && e.touches[0]) || (e.changedTouches && e.changedTouches[0]);
        const cx = touch ? touch.clientX : e.clientX;
        const cy = touch ? touch.clientY : e.clientY;
        if (!rect || rect.width <= 0 || rect.height <= 0) {
          return { x: e.offsetX || 0, y: e.offsetY || 0 };
        }
        return {
          x: clamp((cx - rect.left) * (W / rect.width), 0, W),
          y: clamp((cy - rect.top) * (H / rect.height), 0, H)
        };
      };

      canvas.addEventListener('pointerdown', (e) => {
        const active = canvas.__activeSimWrapper;
        if (!active) return;
        const { x, y } = getCoords(e);
        active._handlePointerDown(x, y, internalState, true);
      });

      canvas.addEventListener('pointermove', (e) => {
        const active = canvas.__activeSimWrapper;
        if (!active) return;
        const { x, y } = getCoords(e);
        active._handlePointerMove(x, y, internalState, true);
      });

      if (typeof window !== 'undefined' && typeof window.addEventListener === 'function') {
        window.addEventListener('pointerup', (e) => {
          const active = canvas.__activeSimWrapper;
          if (!active) return;
          const { x, y } = getCoords(e);
          active._handlePointerUp(x, y, internalState, true);
        });
      }
    }

    const wrapper = {
      id: simDef.id,
      title: simDef.title,
      name: simDef.title,
      subtitle: simDef.subtitle || '',
      description: simDef.description || '',
      category: simDef.category || 'chemistry',
      width: W,
      height: H,
      modes: simDef.modes || [],
      tabs: simDef.modes || [],
      controls: simDef.controls || [],
      formulas: simDef.formulas || [],

      getInitialState() {
        internalState = simDef.createState();
        internalState.__simInitialized = true;
        internalState.__simId = simDef.id;
        return internalState;
      },

      init(...args) {
        const ctx = resolveCtx(args);
        if (ctx && ctx.canvas) {
          lastCanvas = ctx.canvas;
          bindCanvasOnce(ctx.canvas);
        }
        const fresh = simDef.createState();
        fresh.__simInitialized = true;
        fresh.__simId = simDef.id;
        for (let i = 0; i < args.length; i++) {
          const a = args[i];
          if (a && typeof a === 'object' && typeof a.fillRect !== 'function' && !(typeof HTMLElement !== 'undefined' && a instanceof HTMLElement)) {
            Object.keys(a).forEach(k => delete a[k]);
            Object.assign(a, fresh);
            internalState = a;
            return a;
          }
        }
        internalState = fresh;
        return internalState;
      },

      setup(...args) {
        return this.init(...args);
      },

      reset(...args) {
        return this.init(...args);
      },

      update(...args) {
        const state = resolveState(args);
        const dt = resolveDt(args);
        simDef.update(state, dt);
      },

      step(...args) {
        return this.update(...args);
      },

      draw(...args) {
        const ctx = resolveCtx(args);
        const state = resolveState(args);
        if (!ctx) return;
        if (ctx.canvas) {
          lastCanvas = ctx.canvas;
          bindCanvasOnce(ctx.canvas);
        }
        state.uiRegions = [];
        simDef.draw(ctx, state);
      },

      render(...args) {
        return this.draw(...args);
      },

      _handlePointerDown(x, y, state, fromDom = false) {
        const now = Date.now();
        if (now - lastPointerStamp < 6 && !fromDom) return;
        lastPointerStamp = now;

        const st = state || internalState;
        const regions = st.uiRegions || [];
        for (let i = regions.length - 1; i >= 0; i--) {
          const reg = regions[i];
          if (x >= reg.x && x <= reg.x + reg.w && y >= reg.y && y <= reg.y + reg.h) {
            if (reg.type === 'button' && reg.onClick) {
              reg.onClick();
              return;
            }
            if (reg.type === 'slider' && reg.onChange) {
              st.__activeSlider = reg;
              const t = clamp((x - reg.trackX) / (reg.trackW || 1), 0, 1);
              const raw = reg.min + t * (reg.max - reg.min);
              const stepped = reg.step ? Math.round(raw / reg.step) * reg.step : raw;
              reg.onChange(clamp(Number(stepped.toFixed(6)), reg.min, reg.max));
              return;
            }
          }
        }
        if (simDef.onPointerDown) {
          simDef.onPointerDown(st, x, y);
        }
      },

      _handlePointerMove(x, y, state) {
        const st = state || internalState;
        if (st.__activeSlider) {
          const reg = st.__activeSlider;
          const t = clamp((x - reg.trackX) / (reg.trackW || 1), 0, 1);
          const raw = reg.min + t * (reg.max - reg.min);
          const stepped = reg.step ? Math.round(raw / reg.step) * reg.step : raw;
          reg.onChange(clamp(Number(stepped.toFixed(6)), reg.min, reg.max));
          return;
        }
        if (simDef.onPointerMove) {
          simDef.onPointerMove(st, x, y);
        }
      },

      _handlePointerUp(x, y, state) {
        const st = state || internalState;
        st.__activeSlider = null;
        if (simDef.onPointerUp) {
          simDef.onPointerUp(st, x, y);
        }
      },

      onPointerDown(...args) {
        const st = resolveState(args);
        const { x, y } = resolvePointer(args);
        this._handlePointerDown(x, y, st, false);
      },

      onMouseDown(...args) {
        this.onPointerDown(...args);
      },

      onClick(...args) {
        this.onPointerDown(...args);
      },

      onPointerMove(...args) {
        const st = resolveState(args);
        const { x, y } = resolvePointer(args);
        this._handlePointerMove(x, y, st);
      },

      onMouseMove(...args) {
        this.onPointerMove(...args);
      },

      onPointerUp(...args) {
        const st = resolveState(args);
        const { x, y } = resolvePointer(args);
        this._handlePointerUp(x, y, st);
      },

      onMouseUp(...args) {
        this.onPointerUp(...args);
      },

      onControlChange(key, value, maybeState) {
        const st = (maybeState && typeof maybeState === 'object') ? maybeState : internalState;
        if (simDef.onControlChange) {
          simDef.onControlChange(st, key, value);
        } else {
          st[key] = value;
        }
      },

      setParam(key, value, maybeState) {
        this.onControlChange(key, value, maybeState);
      },

      onModeChange(modeId, maybeState) {
        this.onControlChange('mode', modeId, maybeState);
      }
    };

    return wrapper;
  }

  // ============================================================================
  // 1. 'density' (密度)
  // ============================================================================

  const DENSITY_MATERIALS = {
    wood:     { id: 'wood',     name: '木头 (Wood)',     density: 0.40, color: '#d97706', stroke: '#92400e', textColor: '#ffffff' },
    ice:      { id: 'ice',      name: '冰块 (Ice)',      density: 0.92, color: '#7dd3fc', stroke: '#0284c7', textColor: '#0f172a' },
    brick:    { id: 'brick',    name: '砖块 (Brick)',    density: 2.00, color: '#dc2626', stroke: '#7f1d1d', textColor: '#ffffff' },
    aluminum: { id: 'aluminum', name: '铝块 (Al)',       density: 2.70, color: '#94a3b8', stroke: '#475569', textColor: '#0f172a' },
    gold:     { id: 'gold',     name: '金块 (Gold)',     density: 19.30, color: '#facc15', stroke: '#a16207', textColor: '#0f172a' },
    custom:   { id: 'custom',   name: '自定义 (Custom)', density: 1.00, color: '#8b5cf6', stroke: '#4c1d95', textColor: '#ffffff' }
  };

  const MYSTERY_REFERENCE_TABLE = [
    { name: '木头 (Wood)', density: 0.40 },
    { name: '汽油 (Gasoline)', density: 0.70 },
    { name: '冰 (Ice)', density: 0.92 },
    { name: '水 (Water)', density: 1.00 },
    { name: '铝 (Aluminum)', density: 2.70 },
    { name: '铁/钢 (Steel)', density: 7.80 },

  ];

  const DENSITY_TANK = {

  };
  const DENSITY_SCALE = {

  function volumeToTankHeightPx(volL) {
    return (volL / 100.0) * 220.0;
  }

  function blockSizeFromVolume(volL) {
    const side = clamp(34 + Math.cbrt(clamp(volL, 0.5, 15)) * 22, 38, 92);
    return { w: side, h: side };
  }

  function buildDensityBlocksForMode(mode, customMat = 'wood', customM = 2.0, customV = 5.0) {
    if (mode === 'custom') {
      const mat = DENSITY_MATERIALS[customMat] || DENSITY_MATERIALS.wood;

      const sz = blockSizeFromVolume(v);
      return [{
        id: 'B1',
        label: mat.name.split(' ')[0],

        mass: m,
        volume: v,
        color: mat.color,
        stroke: mat.stroke,
        textColor: mat.textColor,
        x: DENSITY_TANK.x + DENSITY_TANK.w * 0.5,
        y: 235,
        vy: 0,
        w: sz.w,
        h: sz.h,
        inTank: true,
        onScale: false,
        mystery: false
